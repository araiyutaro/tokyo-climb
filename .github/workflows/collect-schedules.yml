name: Collect Bouldering Gym Schedules

on:
  schedule:
    # Run every 6 hours (00:15, 06:15, 12:15, 18:15 UTC = 09:15, 15:15, 21:15, 03:15 JST)
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run schedule collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run collect

      - name: Validate collected dataset & run tests
        run: npm test

      - name: Commit updated schedules if changed
        run: |
          if git diff --quiet data/events.json; then
            echo "No schedule changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/events.json
            git commit -m "chore(data): update gym schedules [skip ci]"
            git push
          fi
